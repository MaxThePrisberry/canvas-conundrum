repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Puzzle source images (assets/puzzle-sources/*) can be a few MB.
        # Tiles are generated at build time and never committed.
        args: ["--maxkb=5120"]

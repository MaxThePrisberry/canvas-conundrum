# Single-origin reverse proxy: the browser talks only to the frontend
# container, which forwards WebSocket and API traffic to the backend over
# the internal compose network. Same-origin everywhere kills CORS and
# means QR codes / public URLs only need one host.

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # ── WebSocket endpoints (player + host) ──────────────────────────
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSockets are long-lived; don't drop them on idle.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Authenticated REST (segment tiles, full-image previews) ──────
    # Backend gates these on session token; nginx is just a passthrough.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Static SPA ───────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # Long cache for hashed build assets, none for index.html.
        location ~* \.(js|css|woff2?|png|jpg|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
